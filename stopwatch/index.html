<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="border"> <!--border biar responsive karena kalau pakai border yang dari divnya susah buat responsivenya -->
        <div class="container"><!--Container buat nampung waktu sama buttonnya-->
            <div class="time"><!--Display waktu-->
                00:00:00:000
            </div>
            <div class="buttons"><!--Button-->
                <button id="pause">Pause</button>
                <button id="start">Start</button>
                <button id="reset">Reset</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
