<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="container"><!--Container untuk nampung semuanya-->
            <div class="items"><!--Container element-elemetn per slide-->
                <div class="item-1 active">1.</div>
                <div class="item-2">2.</div>
                <div class="item-3">3.</div>
                <div class="arrow"><!--Panah yang ditaruh jadi bagian dari items-->
                    <button id="left-btn">&#11164</button>
                    <button id="right-btn">&#11166</button>
                </div>
            </div>
            <div class="marker"><!--Marker untuk menandakan slide keberapa-->
                <div class="marker-1 active-marker"></div>
                <div class="marker-2"></div>
                <div class="marker-3"></div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
